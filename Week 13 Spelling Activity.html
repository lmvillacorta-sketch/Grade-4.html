<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spelling Battle - Final Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4caf50; --secondary: #ff9800; --correct: #2e7d32; --wrong: #d32f2f; }
        * { touch-action: manipulation; box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            background: #e3f2fd; background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 95%; max-width: 800px; background: rgba(255, 255, 255, 0.98);
            border-radius: 25px; padding: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 5px solid var(--primary);
            position: relative;
        }

        .tabs { position: absolute; top: -42px; left: 20px; display: flex; gap: 5px; }
        .tab { 
            padding: 8px 18px; background: var(--primary); color: white; 
            border-radius: 12px 12px 0 0; cursor: pointer; font-family: 'Fredoka One';
        }
        .tab.active { background: white; color: var(--primary); border: 3px solid var(--primary); border-bottom: none; }

        .stats {
            display: flex; justify-content: space-around; background: #f1f8e9;
            padding: 8px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; font-size: 1.1rem;
        }

        #image-display {
            width: 240px; height: 150px; margin: 0 auto 10px; border-radius: 12px;
            border: 3px solid #fff; background-size: contain; background-repeat: no-repeat;
            background-position: center; background-color: #f5f5f5; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #word-slots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 50px; }
        .slot {
            width: 38px; height: 48px; border-bottom: 3px solid #2e7d32;
            font-size: 2rem; display: flex; justify-content: center; align-items: center; cursor: default;
        }
        .slot.blank { background: #fff9c4; border-radius: 6px; }

        #letter-bank {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
            padding: 12px; background: rgba(0,0,0,0.04); border-radius: 12px;
        }
        .tile {
            width: 50px; height: 50px; background: #ff7043; color: white;
            border-radius: 10px; font-size: 2rem; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 0 #d84315; font-family: 'Fredoka One';
            user-select: none;
        }
        .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 #d84315; }
        .tile.used { opacity: 0.1; pointer-events: none; }

        #editor-container { max-height: 280px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid #ddd; border-radius: 10px; background: #fff; }
        .edit-row { display: flex; align-items: center; gap: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        .img-preview { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; background: #eee; }

        .btn {
            background: var(--secondary); color: white; border: none; padding: 10px 20px;
            font-size: 1rem; border-radius: 50px; cursor: pointer;
            font-family: 'Fredoka One'; margin: 5px; box-shadow: 0 4px 0 #e68a00;
        }
        .btn-small { padding: 5px 12px; font-size: 0.75rem; background: #2196f3; box-shadow: 0 3px 0 #1976d2; }
        .hidden { display: none !important; }

        #feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; pointer-events: none; }
        .feedback-mark { font-size: 8rem; animation: popIn 0.6s ease-out forwards; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        
        #code-output { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: none; padding: 20px; box-sizing: border-box; }
        #code-area { width: 100%; height: 80%; font-family: monospace; font-size: 10px; }
    </style>
</head>
<body>

<audio id="bg-music" loop><source src="https://assets.mixkit.co/music/preview/mixkit-games-world-music-611.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <div class="tabs">
        <div class="tab active" id="tab-play" onclick="showView('play')">PLAY</div>
        <div class="tab" id="tab-edit" onclick="showView('edit')">EDIT</div>
    </div>

    <div id="view-play">
        <div id="menu">
            <h1 style="color:var(--primary); font-family:'Fredoka One';">Spelling Battle!</h1>
            <div id="group-btns"></div>
        </div>
        <div id="game-arena" class="hidden">
            <div class="stats">
                <span id="stat-timer" style="color:red">⏳ 90s</span>
                <span id="stat-lives">❤️❤️❤️❤️❤️</span>
                <span>Score: <span id="stat-score">0</span></span>
            </div>
            <div id="image-display"></div>
            <div id="word-slots"></div>
            <div id="letter-bank"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <div id="view-edit" class="hidden">
        <h3>Teacher Settings</h3>
        <div style="background:#fff3e0; padding:10px; border-radius:10px; margin-bottom:10px; display:flex; gap:5px; flex-wrap:wrap; justify-content:center;">
            <button class="btn btn-small" onclick="pasteImage('bg')">PASTE BG</button>
            <button class="btn btn-small" style="background:#4caf50;" onclick="generateFinalCode()">🚀 GENERATE FINAL FILE</button>
            <button class="btn btn-small" style="background:#f44336;" onclick="resetGame()">🗑️ RESET</button>
        </div>
        <div id="editor-container"></div>
        <button class="btn" style="background:#4caf50; width:100%; margin-top:10px;" onclick="saveToLocal()">SAVE CHANGES</button>
    </div>

    <div id="view-end" class="hidden">
        <h1 id="end-title">FINISH!</h1>
        <p id="end-final-score" style="font-size:2rem;"></p>
        <button class="btn" onclick="location.reload()">TRY AGAIN</button>
    </div>
</div>

<div id="code-output">
    <h3>Copy this code to Notepad & Save as .html</h3>
    <textarea id="code-area" readonly></textarea><br>
    <button class="btn" onclick="document.getElementById('code-output').style.display='none'">CLOSE</button>
</div>

<script>
    const sndCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const sndWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3');
    const bgMusic = document.getElementById('bg-music');

    let gameData = JSON.parse(localStorage.getItem('SpellingFinal_V4')) || {
        bg: "",
        sets: Array.from({length: 4}, (_, i) => ({
            group: i + 1,
            words: Array.from({length: 5}, () => ({t: "word", i: ""}))
        }))
    };

    let activeSet, score, lives, timer, timerInt, wordIdx, currentTarget, isTransitioning = false;

    function showView(v) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('view-play').classList.add('hidden');
        document.getElementById('view-edit').classList.add('hidden');
        if(v === 'play') {
            document.getElementById('tab-play').classList.add('active');
            document.getElementById('view-play').classList.remove('hidden');
            initPlayMenu();
        } else {
            document.getElementById('tab-edit').classList.add('active');
            document.getElementById('view-edit').classList.remove('hidden');
            renderEditor();
        }
    }

    async function compressImage(base64Str, maxWidth = 400) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = maxWidth / img.width;
                if(scale >= 1) return resolve(base64Str);
                canvas.width = maxWidth;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
        });
    }

    async function pasteImage(target) {
        try {
            const items = await navigator.clipboard.read();
            for (const item of items) {
                if (item.types.some(t => t.startsWith("image/"))) {
                    const blob = await item.getType(item.types.find(t => t.startsWith("image/")));
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const compressed = await compressImage(e.target.result, target === 'bg' ? 800 : 300);
                        if(target === 'bg') {
                            gameData.bg = compressed;
                            document.body.style.backgroundImage = `url(${compressed})`;
                        } else {
                            const [sIdx, wIdx] = target.split('-');
                            gameData.sets[sIdx].words[wIdx].i = compressed;
                            document.getElementById(`img-${sIdx}-${wIdx}`).src = compressed;
                        }
                    };
                    reader.readAsDataURL(blob);
                    return;
                }
            }
        } catch (e) { alert("Clipboard error. Use Chrome or Edge."); }
    }

    function renderEditor() {
        const container = document.getElementById('editor-container');
        container.innerHTML = "";
        gameData.sets.forEach((s, sIdx) => {
            container.innerHTML += `<div style="font-weight:bold; color:var(--primary); margin-top:10px;">Set ${s.group}</div>`;
            s.words.forEach((w, wIdx) => {
                const div = document.createElement('div');
                div.className = "edit-row";
                div.innerHTML = `
                    <input type="text" value="${w.t}" id="txt-${sIdx}-${wIdx}" style="width:70px; text-transform:lowercase;">
                    <button class="btn btn-small" onclick="pasteImage('${sIdx}-${wIdx}')">IMG</button>
                    <img src="${w.i || ''}" id="img-${sIdx}-${wIdx}" class="img-preview">
                `;
                container.appendChild(div);
            });
        });
    }

    function saveToLocal() {
        gameData.sets.forEach((s, sIdx) => {
            s.words.forEach((w, wIdx) => {
                w.t = document.getElementById(`txt-${sIdx}-${wIdx}`).value.toLowerCase().trim();
            });
        });
        localStorage.setItem('SpellingFinal_V4', JSON.stringify(gameData));
        alert("Saved to this browser memory!");
        showView('play');
    }

    function generateFinalCode() {
        saveToLocal();
        const dataTag = `<script id="game-state">window.preloadedData = ${JSON.stringify(gameData)};<\/script>`;
        let html = document.documentElement.outerHTML;
        html = html.replace(/<script id="game-state">.*?<\/script>/g, "");
        const finalHTML = html.replace("</body>", dataTag + "</body>");
        
        document.getElementById('code-output').style.display = 'block';
        document.getElementById('code-area').value = finalHTML;
        document.getElementById('code-area').select();
    }

    function resetGame() { if(confirm("Clear everything?")) { localStorage.clear(); location.reload(); } }

    function initPlayMenu() {
        if(window.preloadedData && !localStorage.getItem('SpellingFinal_V4')) gameData = window.preloadedData;
        if(gameData.bg) document.body.style.backgroundImage = `url(${gameData.bg})`;
        const container = document.getElementById('group-btns');
        container.innerHTML = "";
        gameData.sets.forEach((s, i) => {
            const b = document.createElement('button');
            b.className = "btn"; b.innerText = `LEVEL ${s.group}`;
            b.onclick = () => { bgMusic.play().catch(e=>{}); startRound(i); };
            container.appendChild(b);
        });
    }

    function startRound(idx) {
        activeSet = gameData.sets[idx];
        score = 0; lives = 5; timer = 90; wordIdx = 0;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-arena').classList.remove('hidden');
        updateUI(); nextWord();
        if(timerInt) clearInterval(timerInt);
        timerInt = setInterval(() => { timer--; document.getElementById('stat-timer').innerText = `⏳ ${timer}s`; if(timer <= 0) endGame("TIME'S UP!"); }, 1000);
    }

    function nextWord() {
        if (wordIdx >= activeSet.words.length) return endGame("WINNER!");
        isTransitioning = false;
        const data = activeSet.words[wordIdx];
        currentTarget = data.t;
        document.getElementById('image-display').style.backgroundImage = data.i ? `url(${data.i})` : "none";
        renderBoard(currentTarget);
        wordIdx++;
    }

    function renderBoard(word) {
        const slots = document.getElementById('word-slots');
        const bank = document.getElementById('letter-bank');
        slots.innerHTML = ""; bank.innerHTML = "";
        let indices = []; for(let i=0; i<word.length; i++) if(word[i] !== " ") indices.push(i);
        let hidden = [];
        let count = Math.max(1, Math.min(3, indices.length - 1));
        while(hidden.length < count) { 
            let r = indices[Math.floor(Math.random()*indices.length)]; 
            if(!hidden.includes(r)) hidden.push(r); 
        }

        let letters = [];
        for(let i=0; i<word.length; i++) {
            let s = document.createElement('div'); s.className = "slot";
            if(word[i] === " ") { s.style.border = "none"; s.style.width = "10px"; }
            else if(hidden.includes(i)) { s.classList.add('blank'); letters.push(word[i]); }
            else { s.innerText = word[i]; }
            slots.appendChild(s);
        }

        const az = "abcdefghijklmnopqrstuvwxyz";
        while(letters.length < 8) letters.push(az[Math.floor(Math.random()*26)]);
        letters.sort(() => Math.random() - 0.5).forEach(c => {
            const t = document.createElement('div'); t.className = "tile"; t.innerText = c;
            t.onclick = function() {
                if(isTransitioning) return;
                const empty = [...document.querySelectorAll('.slot.blank')].find(s => !s.innerText);
                if(empty) { 
                    empty.innerText = this.innerText; 
                    this.classList.add('used'); 
                    checkAnswer(); 
                }
            };
            bank.appendChild(t);
        });
    }

    function checkAnswer() {
        const blanks = document.querySelectorAll('.slot.blank');
        if([...blanks].every(s => s.innerText)) {
            isTransitioning = true;
            let guess = [...document.querySelectorAll('.slot')].map(s => s.innerText || " ").join("");
            if(guess === currentTarget) {
                score++; sndCorrect.play(); showMark("✅", "var(--correct)"); setTimeout(nextWord, 1000);
            } else {
                lives--; sndWrong.play(); showMark("❌", "var(--wrong)");
                if(lives <= 0) endGame("GAME OVER");
                else setTimeout(() => { blanks.forEach(s => s.innerText = ""); document.querySelectorAll('.tile').forEach(t => t.classList.remove('used')); isTransitioning = false; }, 800);
            }
            updateUI();
        }
    }

    function showMark(m, c) {
        const f = document.getElementById('feedback');
        f.innerHTML = `<div class="feedback-mark" style="color:${c}">${m}</div>`;
        setTimeout(() => f.innerHTML = "", 800);
    }

    function updateUI() {
        document.getElementById('stat-score').innerText = score;
        let l = ""; for(let i=0; i<5; i++) l += (i < lives) ? "❤️" : "🖤";
        document.getElementById('stat-lives').innerText = l;
    }

    function endGame(msg) { clearInterval(timerInt); document.getElementById('view-play').classList.add('hidden'); document.getElementById('view-end').classList.remove('hidden'); document.getElementById('end-title').innerText = msg; document.getElementById('end-final-score').innerText = `Score: ${score}`; }

    showView('play');
</script>
<script id="game-state">window.preloadedData = null;</script>
</body>
</html>
